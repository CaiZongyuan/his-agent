[project]
name = "his-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pypdf>=6.16.2",
]
ppt-master = [
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.7.0",
    "ebooklib>=0.18",
    "edge-tts>=7.2.8",
    "flask>=3.0.0",
    "google-genai>=1.0.0",
    "mammoth>=1.6.0",
    "markdownify>=0.11.6",
    "nbconvert>=7.0.0",
    "numpy>=1.20.0",
    "openpyxl>=3.1.0",
    "pillow>=9.0.0",
    "pymupdf>=1.23.0",
    "python-pptx>=0.6.21",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "skia-pathops>=0.9.2",
    "uharfbuzz>=0.50.0",
    "xlsxwriter>=3.0.0",
]

[tool.uv]
# ppt-master 依赖默认随 uv sync 安装（skill 经 .claude/skills/ppt-master 链接到 references/ppt-master）
default-groups = ["dev", "ppt-master"]
